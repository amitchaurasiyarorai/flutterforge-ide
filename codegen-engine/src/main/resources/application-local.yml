anthropic:
  api:
    key: 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   # get from console.anthropic.com

server:
  port: 9876
  netty:
    max-initial-line-length: 65536

spring:
  codec:
    max-in-memory-size: 52428800   # 50 MB — fixes HTTP 430 on large project build payloads
  mvc:
    async:
      # -1 = no timeout — build can take 5-10 min for first APK (Gradle download)
      request-timeout: -1

logging:
  level:
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: DEBUG
